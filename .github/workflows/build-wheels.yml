name: Build wheels

on:
  push:
    branches: [trunk]
    tags: ["[0-9]*"]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-wheels:
    name: Build Linux wheels
    runs-on: xcp-medium-4g
    container:
      image: harbor.svc.xyme.cloud/xcp/test-runner:python
    steps:
      - name: Checkout repo
        uses: xymeai/xyme-github-actions/checkout@main

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ make
          rm -rf /var/lib/apt/lists/*

      - name: Build wheels
        run: |
          uv pip install --system cibuildwheel==2.21.3
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win* *-musllinux* *i686* *-macos*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BEFORE_ALL: "pip install cmake"
          CIBW_BEFORE_BUILD: "bash {project}/scripts/build-boost.sh 1.86.0"
          CIBW_ENVIRONMENT: >-
            BOOST_ROOT=/usr/local
            CMAKE_PREFIX_PATH=/usr/local
            CFLAGS=-march=x86-64-v3
            CXXFLAGS=-march=x86-64-v3
          CIBW_ENABLE: "cpython-prerelease"
          CIBW_TEST_COMMAND: >-
            python -c "from mkdssp import dssp; print('mkdssp OK')"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: xcp-medium-4g
    container:
      image: harbor.svc.xyme.cloud/xcp/test-runner:python
    steps:
      - name: Checkout repo
        uses: xymeai/xyme-github-actions/checkout@main

      - name: Build sdist
        run: uv build --sdist --out-dir dist/

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to Xyme PyPI
    needs: [build-wheels, build-sdist]
    runs-on: xcp-medium-4g
    container:
      image: harbor.svc.xyme.cloud/xcp/test-runner:python
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to Xyme PyPI (prd + dev)
        run: |
          uv publish --publish-url https://pypi.prd.xyme.cloud/ --username "test"
          uv publish --publish-url https://pypi.dev.xyme.cloud/ --username "test"
