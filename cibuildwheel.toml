[build]
test-command = "python -c \"from mkdssp import dssp; print('mkdssp OK')\""

[build.requires]
scikit-build-core = ">=0.10"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
enable = ["cpython-prerelease"]

[tool.cibuildwheel.linux]
before-all = [
    # CMake 3.23+ required by dssp
    "pip install cmake",
]
before-build = [
    # Build Boost.Python against the target Python version
    "bash {project}/scripts/build-boost.sh 1.86.0",
]

[tool.cibuildwheel.linux.environment]
BOOST_ROOT = "/usr/local"
CMAKE_PREFIX_PATH = "/usr/local"
# Lock to AVX2 (x86-64-v3) for broad compatibility on modern x86 CPUs
CFLAGS = "-march=x86-64-v3"
CXXFLAGS = "-march=x86-64-v3"

[tool.cibuildwheel.macos]
before-build = [
    "bash {project}/scripts/build-boost.sh 1.86.0",
]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
BOOST_ROOT = "/usr/local"
CMAKE_PREFIX_PATH = "/usr/local"
